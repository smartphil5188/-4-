<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>作業全對獎勵！雷電極限進化：終極空戰</title>
    <style>
        body {
            background-color: #020208; color: #fff; font-family: sans-serif; text-align: center;
            margin: 0; padding: 0; overflow: hidden; touch-action: none; user-select: none;
        }
        #game-container {
            position: relative; width: 100vw; height: 100vh; max-width: 450px; margin: 0 auto;
            background: radial-gradient(circle, #090b26, #030308);
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.4);
            border-left: 3px solid #00f0ff; border-right: 3px solid #00f0ff; box-sizing: border-box;
        }
        #ui-top {
            position: absolute; top: 10px; width: 100%; z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; align-items: center;
        }
        .banner {
            background: linear-gradient(90deg, #ff007f, #7f00ff); color: #fff;
            padding: 5px 15px; border-radius: 20px; font-size: 15px; font-weight: bold;
            box-shadow: 0 0 15px #ff007f; text-shadow: 1px 1px 2px #000;
        }
        .score-box {
            margin-top: 4px; font-size: 12px; font-weight: bold;
            background: rgba(0,0,0,0.85); padding: 5px 12px; border-radius: 10px;
            border: 1px solid #7f00ff; line-height: 1.5; width: 85%; text-align: left;
        }
        /* 🎮 開頭新手引導介紹畫面 */
        #intro-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 20, 0.9); z-index: 20;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; box-sizing: border-box;
        }
        .intro-card {
            background: rgba(15, 23, 42, 0.95); border: 2px solid #00f0ff;
            border-radius: 16px; padding: 20px; width: 90%;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
        }
        .intro-title { font-size: 20px; font-weight: bold; color: #ffde00; margin-bottom: 15px; }
        .intro-item { text-align: left; font-size: 14px; margin: 10px 0; line-height: 1.4; color: #e2e8f0; }
        .start-btn {
            margin-top: 15px; background: linear-gradient(90deg, #ff007f, #7f00ff);
            border: none; color: #fff; padding: 10px 30px; font-size: 16px;
            font-weight: bold; border-radius: 25px; cursor: pointer; box-shadow: 0 0 10px #ff007f;
        }
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 🎮 新手引導開頭介紹 -->
        <div id="intro-overlay">
            <div class="intro-card">
                <div class="intro-title">🛸 雷電極限空戰：大師指南 🛸</div>
                <div class="intro-item">🕹️ <b>如何操作：</b>用一根手指按住螢幕任意滑動，戰機就會零延遲跟隨走位，子彈會自動狂轟！</div>
                <div class="intro-item">🟥 <b>W 紅色水晶：</b>解鎖「狂暴散彈」，大範圍扇形擴散狂轟，適合清小兵！</div>
                <div class="intro-item">🟦 <b>L 藍色水晶：</b>解鎖「巨型雷射槍」，轟出一條頂天立地的全貫穿光束！</div>
                <div class="intro-item">🟩 <b>S 綠色護盾：</b>啟動無敵發光力場，能抵擋 2 次傷害！</div>
                <div class="intro-item">💊 <b>H 醫藥箱：</b>戰艦加血 25%。 | 🌟 <b>1P 星星：</b>生命隻數直接 +1！</div>
                <button class="start-btn" onclick="startGame()">⚡ 啟動引擎・開戰！</button>
            </div>
        </div>

        <div id="ui-top">
            <div class="banner">🚀 作業完勝！雷電極限進化：終極空戰 🚀</div>
            <div class="score-box">
                ✨ 得分: <span id="ui-score" style="color:#00ffcc;">0</span> | 🚀 剩餘生命 (1UP): <span id="ui-lives" style="color:#ffbd03;">3</span> 隻<br>
                ❤️ 戰艦血量: <span id="ui-hp" style="color:#ff0055;">100</span>% | 🛡️ 護盾: <span id="ui-shield" style="color:#00f0ff;">無</span><br>
                ⚔️ 武器系統: <span id="ui-weapon" style="color:#ffde00;">初始機砲 (Lv.1)</span>
            </div>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');
        
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;

        let score = 0, gameActive = false, frameCount = 0;

        let player = {
            x: canvas.width / 2, y: canvas.height - 120,
            w: 44, h: 48, hp: 100, maxHp: 100, lives: 3,
            weaponType: 'normal', weaponLevel: 1, shield: 0
        };

        let playerBullets = [], enemyBullets = [], enemies = [], particles = [], stars = [], powerups = [];

        for (let i = 0; i < 25; i++) {
            stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, speed: Math.random() * 1.5 + 0.5, size: Math.random() * 1.5 });
        }

        let isDragging = false;
        function handleMove(clientX, clientY) {
            if (!gameActive) return;
            const rect = canvas.getBoundingClientRect();
            let targetX = clientX - rect.left; let targetY = clientY - rect.top;
            if(targetX > player.w/2 && targetX < canvas.width - player.w/2) player.x = targetX;
            if(targetY > player.h/2 && targetY < canvas.height - player.h/2) player.y = targetY;
        }

        window.addEventListener('mousedown', (e) => { isDragging = true; handleMove(e.clientX, e.clientY); });
        window.addEventListener('mousemove', (e) => { if(isDragging) handleMove(e.clientX, e.clientY); });
        window.addEventListener('mouseup', () => { isDragging = false; });
        window.addEventListener('touchstart', (e) => { handleMove(e.touches.clientX, e.touches.clientY); }, {passive: true});
        window.addEventListener('touchmove', (e) => { handleMove(e.touches.clientX, e.touches.clientY); }, {passive: true});

        function startGame() {
            document.getElementById('intro-overlay').style.display = 'none';
            initGame();
        }

        function createExplosion(x, y, color, count = 10) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5,
                    size: Math.random() * 3 + 2, color: color, alpha: 1
                });
            }
        }
        function drawPlayerJet(x, y, w, h) {
            ctx.save(); ctx.translate(x, y);
            if (frameCount % 2 === 0) {
                particles.push({
                    x: x + (Math.random() - 0.5) * 6, y: y + h/2,
                    vx: (Math.random() - 0.5) * 0.8, vy: Math.random() * 2 + 3,
                    size: Math.random() * 3 + 1, color: '#00f0ff', alpha: 0.8
                });
            }
            ctx.fillStyle = '#0055ff'; ctx.beginPath();
            ctx.moveTo(-w/2, h/4); ctx.lineTo(w/2, h/4); ctx.lineTo(0, -h/2); ctx.closePath(); ctx.fill();
            ctx.fillStyle = player.weaponType === 'red' ? '#ff0055' : (player.weaponType === 'blue' ? '#00f0ff' : '#ffffff');
            ctx.fillRect(-6, -h/3, 12, h * 0.8);
            ctx.fillStyle = '#ff007f'; ctx.fillRect(-w/2, 0, 4, 15); ctx.fillRect(w/2 - 4, 0, 4, 15);
            ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.ellipse(0, -5, 4, 8, 0, 0, Math.PI*2); ctx.fill();
            
            if (player.shield > 0) {
                ctx.strokeStyle = player.shield === 2 ? '#00ffff' : '#00ff55';
                ctx.lineWidth = player.shield === 2 ? 4 : 2;
                ctx.shadowBlur = 15; ctx.shadowColor = ctx.strokeStyle;
                ctx.beginPath(); ctx.arc(0, 0, w * 0.9, 0, Math.PI * 2); stroke();
            }
            ctx.restore();
        }

        // 🎨 5種全新升級：手繪星際帥氣敵艦美術外型
        function drawEnemy(e) {
            ctx.save(); ctx.translate(e.x, e.y);
            ctx.shadowBlur = 10;

            if (frameCount % 4 === 0) {
                particles.push({
                    x: e.x + (Math.random() - 0.5) * 6, y: e.y - e.h/2,
                    vx: (Math.random() - 0.5) * 0.5, vy: -(Math.random() * 2 + 1),
                    size: Math.random() * 3 + 1, color: '#ff5500', alpha: 0.7
                });
            }

            if (e.type === 'boss') {
                ctx.shadowColor = '#ffbb00'; ctx.fillStyle = '#ffcc00';
                ctx.beginPath();
                ctx.moveTo(0, e.h/2); ctx.lineTo(-e.w/2, -e.h/2); ctx.lineTo(-e.w/4, -e.h/4);
                ctx.lineTo(0, -e.h/2); ctx.lineTo(e.w/4, -e.h/4); ctx.lineTo(e.w/2, -e.h/2);
                ctx.closePath(); ctx.fill();
                ctx.fillStyle = '#ff3300'; ctx.fillRect(-e.w/3, -4, 6, 12); ctx.fillRect(e.w/3 - 6, -4, 6, 12);
            } else if (e.type === 'sniper') {
                ctx.shadowColor = '#ff6a00'; ctx.fillStyle = '#b45309';
                ctx.beginPath();
                ctx.moveTo(0, e.h/2); ctx.lineTo(e.w/2, e.h/4); ctx.lineTo(e.w/2, -e.h/2);
                ctx.lineTo(-e.w/2, -e.h/2); ctx.lineTo(-e.w/2, e.h/4);
                ctx.closePath(); ctx.fill();
                ctx.fillStyle = '#374151'; ctx.fillRect(-4, e.h/4, 8, 12);
            } else if (e.type === 'zigzag') {
                ctx.shadowColor = '#00f0ff'; ctx.fillStyle = '#06b6d4';
                ctx.beginPath();
                ctx.moveTo(0, -e.h/2); ctx.lineTo(e.w/2, -e.h/4); ctx.lineTo(e.w/2, e.h/4);
                ctx.lineTo(0, e.h/2); ctx.lineTo(-e.w/2, e.h/4); ctx.lineTo(-e.w/2, -e.h/4);
                ctx.closePath(); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2); ctx.fill();
            } else {
                ctx.shadowColor = '#ff2266'; ctx.fillStyle = '#e11d48';
                ctx.beginPath();
                ctx.moveTo(0, e.h/2); ctx.lineTo(-e.w/2, -e.h/2); ctx.lineTo(0, -e.h/6); ctx.lineTo(e.w/2, -e.h/2);
                ctx.closePath(); ctx.fill();
            }
            ctx.restore();
        }
        function fireWeapons() {
            let lv = player.weaponLevel;
            let bulletSpeed = -5.5; 
            if (player.weaponType === 'normal') {
                playerBullets.push({ x: player.x - 12, y: player.y - 15, vx: 0, vy: bulletSpeed, type: 'normal' });
                playerBullets.push({ x: player.x + 12, y: player.y - 15, vx: 0, vy: bulletSpeed, type: 'normal' });
            } else if (player.weaponType === 'red') {
                playerBullets.push({ x: player.x, y: player.y - 15, vx: 0, vy: bulletSpeed - 0.5, type: 'red' });
                playerBullets.push({ x: player.x - 6, y: player.y - 15, vx: -1.2, vy: bulletSpeed, type: 'red' });
                playerBullets.push({ x: player.x + 6, y: player.y - 15, vx: 1.2, vy: bulletSpeed, type: 'red' });
                if (lv >= 2) {
                    playerBullets.push({ x: player.x - 12, y: player.y - 10, vx: -2.4, vy: bulletSpeed + 0.5, type: 'red' });
                    playerBullets.push({ x: player.x + 12, y: player.y - 10, vx: 2.4, vy: bulletSpeed + 0.5, type: 'red' });
                }
                if (lv >= 3) {
                    playerBullets.push({ x: player.x - 16, y: player.y - 5, vx: -3.8, vy: bulletSpeed + 1.0, type: 'red' });
                    playerBullets.push({ x: player.x + 16, y: player.y - 5, vx: 3.8, vy: bulletSpeed + 1.0, type: 'red' });
                }
            } else if (player.weaponType === 'blue') {
                playerBullets.push({ x: player.x, y: player.y - 20, w: lv === 1 ? 12 : (lv === 2 ? 24 : 36), type: 'laser' });
            }
        }

        function update() {
            if (!gameActive) return;
            frameCount++;

            stars.forEach(s => { s.y += s.speed; if (s.y > canvas.height) { s.y = -5; s.x = Math.random() * canvas.width; } });

            if (frameCount % 10 === 0) { fireWeapons(); }

            playerBullets.forEach((b, bIdx) => {
                if (b.type === 'laser') {
                    playerBullets.splice(bIdx, 1);
                } else {
                    b.x += b.vx; b.y += b.vy;
                    if (b.y < -20 || b.x < -20 || b.x > canvas.width + 20) playerBullets.splice(bIdx, 1);
                }
            });

            let spawnInterval = score < 150 ? 90 : (score < 500 ? 65 : 45);
            if (frameCount % spawnInterval === 0 && enemies.length < 6) {
                let r = Math.random();
                let type = 'normal', w = 26, h = 26, hp = 1, speed = 1.8;
                
                if (r > 0.82 && score >= 400) { type = 'boss'; w = 60; h = 50; hp = 14; speed = 0.7; }
                else if (r > 0.55 && score >= 200) { type = 'sniper'; w = 32; h = 32; hp = 4; speed = 1.1; }
                else if (r > 0.28 && score >= 80) { type = 'zigzag'; w = 28; h = 28; hp = 1; speed = 1.5; }
                
                enemies.push({
                    x: Math.random() * (canvas.width - 60) + 30, y: -40,
                    w: w, h: h, type: type, hp: hp, speed: speed,
                    zigzagDir: Math.random() > 0.5 ? 1 : -1, zigzagTimer: 0
                });
            }

            enemies.forEach((e, eIdx) => {
                e.y += e.speed;
                if (e.type === 'zigzag') {
                    e.zigzagTimer++;
                    if (e.zigzagTimer % 35 === 0) e.zigzagDir *= -1;
                    e.x += e.zigzagDir * 1.6;
                    if (e.x < 20 || e.x > canvas.width - 20) e.zigzagDir *= -1;
                }

                let ebSpeed = 2.5;
                if (e.type === 'boss' && frameCount % 75 === 0) {
                    for(let i=0; i<6; i++) {
                        let a = (Math.PI / 3) * i + (frameCount * 0.04);
                        enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * ebSpeed, vy: Math.sin(a) * ebSpeed });
                    }
                } else if (e.type === 'sniper' && frameCount % 95 === 0) {
                    let a = Math.atan2(player.y - e.y, player.x - e.x);
                    enemyBullets.push({ x: e.x, y: e.y + e.h/2, vx: Math.cos(a) * (ebSpeed + 0.4), vy: Math.sin(a) * (ebSpeed + 0.4) });
                } else if (e.type === 'normal' && frameCount % 120 === 0 && Math.random() > 0.5) {
                    enemyBullets.push({ x: e.x, y: e.y + e.h/2, vx: 0, vy: ebSpeed });
                }

                if (Math.abs(player.x - e.x) < (player.w + e.w)/2 - 5 && Math.abs(player.y - e.y) < (player.h + e.h)/2 - 5) {
                    enemies.splice(eIdx, 1);
                    damagePlayer(25);
                    createExplosion(e.x, e.y, '#ff3366', 15);
                }
                if (e.y > canvas.height + 40) enemies.splice(eIdx, 1);
            });

            if (frameCount % 240 === 0) {
                let pool = ['red', 'blue', 'shield', 'heal', '1up'];
                let chosen = pool[Math.floor(Math.random() * pool.length)];
                powerups.push({
                    x: Math.random() * (canvas.width - 60) + 30, y: -20,
                    w: 24, h: 24, vx: (Math.random() - 0.5) * 1.2, vy: 1.4,
                    itemType: chosen, changeTimer: 0
                });
            }

            powerups.forEach((p, pIdx) => {
                p.x += p.vx; p.y += p.vy; p.changeTimer++;
                if(p.x < 15 || p.x > canvas.width - 15) p.vx *= -1;
                
                if (p.changeTimer % 140 === 0) {
                    let pool = ['red', 'blue', 'shield', 'heal', '1up'];
                    p.itemType = pool[(pool.indexOf(p.itemType) + 1) % pool.length];
                }

                if (Math.abs(player.x - p.x) < player.w/2 + p.w/2 && Math.abs(player.y - p.y) < player.h/2 + p.h/2) {
                    powerups.splice(pIdx, 1);
                    score += 50;
                    
                    if (p.itemType === 'red' || p.itemType === 'blue') {
                        if (player.weaponType === p.itemType) { if (player.weaponLevel < 3) player.weaponLevel++; }
                        else { player.weaponType = p.itemType; player.weaponLevel = 1; }
                    } else if (p.itemType === 'shield') {
                        if (player.shield < 2) player.shield++;
                    } else if (p.itemType === 'heal') {
                        player.hp = Math.min(player.maxHp, player.hp + 25);
                    } else if (p.itemType === '1up') {
                        player.lives++;
                    }
                    updateUI();
                    createExplosion(player.x, player.y, '#ffffff', 18);
                }
                if (p.y > canvas.height + 30) powerups.splice(pIdx, 1);
            });
            // 敵方慢速子彈移動與判定
            enemyBullets.forEach((eb, ebIdx) => {
                eb.x += eb.vx; eb.y += eb.vy;
                if (Math.abs(eb.x - player.x) < player.w/2 && Math.abs(eb.y - player.y) < player.h/2) {
                    enemyBullets.splice(ebIdx, 1);
                    damagePlayer(8);
                    createExplosion(player.x, player.y, '#ff0000', 8);
                }
                if (eb.y > canvas.height + 20 || eb.x < -20 || eb.x > canvas.width + 20) enemyBullets.splice(ebIdx, 1);
            });

            // 玩家子彈與敵機碰撞消除 (雷射全貫穿判定)
            playerBullets.forEach((pb, pbIdx) => {
                enemies.forEach((e, eIdx) => {
                    let hit = false;
                    if (pb.type === 'laser') {
                        // 巨型雷射槍：只要敵機在光束寬度內且在玩家前方，即產生每影格的融化傷害
                        if (Math.abs(player.x - e.x) < pb.w/2 + e.w/2 && e.y < player.y) {
                            hit = true;
                        }
                    } else {
                        if (Math.abs(pb.x - e.x) < e.w/2 + 4 && Math.abs(pb.y - e.y) < e.h/2 + 4) {
                            hit = true;
                            try { playerBullets.splice(pbIdx, 1); } catch(err){}
                        }
                    }

                    if (hit) {
                        e.hp -= pb.type === 'laser' ? 0.3 : 1;
                        createExplosion(e.x, e.y, '#ffffff', 2);
                        if (e.hp <= 0) {
                            enemies.splice(eIdx, 1);
                            score += e.type === 'boss' ? 100 : (e.type === 'sniper' ? 40 : 10);
                            document.getElementById('ui-score').innerText = score;
                            createExplosion(e.x, e.y, e.type === 'boss' ? '#ffbb00' : (e.type === 'sniper' ? '#ffaa00' : '#ff3366'), e.type === 'boss' ? 25 : 12);
                        }
                    }
                });
            });

            particles.forEach((p, idx) => { p.x += p.vx; p.y += p.vy; p.alpha -= 0.025; if (p.alpha <= 0) particles.splice(idx, 1); });
        }

        function damagePlayer(amount) {
            if (player.shield > 0) {
                player.shield--;
                createExplosion(player.x, player.y, '#00ffcc', 12);
            } else {
                player.hp -= amount;
            }
            updateUI();
            checkPlayerDeath();
        }

        function checkPlayerDeath() {
            if (player.hp <= 0) {
                player.lives--;
                createExplosion(player.x, player.y, '#ff0055', 35);
                updateUI();
                
                if (player.lives <= 0) {
                    gameActive = false;
                    setTimeout(() => {
                        alert(`💥 艦隊全軍覆沒！\n你轟出了 ${score} 分的滿分神戰績！\n作業全對的你是最強機長，重新起飛！`);
                        initGame();
                    }, 50);
                } else {
                    player.hp = 100; player.shield = 1;
                    player.x = canvas.width / 2; player.y = canvas.height - 120;
                    updateUI();
                    alert(`🚀 戰機重生！剩餘生命: ${player.lives} 隻！繼續戰鬥！`);
                }
            }
        }

        function updateUI() {
            document.getElementById('ui-lives').innerText = player.lives;
            document.getElementById('ui-hp').innerText = player.hp;
            document.getElementById('ui-shield').innerText = player.shield === 2 ? '雙層無敵盾 🛡️🛡️' : (player.shield === 1 ? '標準護盾 🛡️' : '無');
            let wName = player.weaponType === 'red' ? '紅・狂暴散彈' : (player.weaponType === 'blue' ? '藍・巨型雷射槍' : '初始機砲');
            document.getElementById('ui-weapon').innerText = `${wName} (Lv.${player.weaponLevel})`;
        }

        function draw() {
            ctx.fillStyle = '#03030d'; ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            stars.forEach(s => { ctx.fillRect(s.x, s.y, s.size, s.size); });

            // 繪製玩家子彈
            playerBullets.forEach(b => {
                ctx.save();
                if (b.type === 'laser') {
                    let laserGrad = ctx.createLinearGradient(b.x - b.w/2, 0, b.x + b.w/2, 0);
                    laserGrad.addColorStop(0, 'rgba(0, 150, 255, 0)');
                    laserGrad.addColorStop(0.2, '#00f0ff');
                    laserGrad.addColorStop(0.5, '#ffffff');
                    laserGrad.addColorStop(0.8, '#00f0ff');
                    laserGrad.addColorStop(1, 'rgba(0, 150, 255, 0)');
                    ctx.fillStyle = laserGrad;
                    ctx.shadowBlur = 25; ctx.shadowColor = '#00f0ff';
                    ctx.fillRect(b.x - b.w/2, 0, b.w, player.y - 15);
                } else {
                    ctx.fillStyle = b.type === 'red' ? '#ff0055' : '#00ffcc';
                    ctx.shadowBlur = 8; ctx.shadowColor = ctx.fillStyle;
                    ctx.fillRect(b.x - 2, b.y, 4, 14);
                }
                ctx.restore();
            });

            // 畫敵方慢速子彈
            ctx.fillStyle = '#ff33ff'; ctx.shadowBlur = 6; ctx.shadowColor = '#ff33ff';
            enemyBullets.forEach(eb => { ctx.beginPath(); ctx.arc(eb.x, eb.y, 4.5, 0, Math.PI*2); ctx.fill(); });
            ctx.restore();

            // 畫敵機
            enemies.forEach(e => { drawEnemy(e); });

            // 畫五大功能變色水晶寶物
            powerups.forEach(p => {
                ctx.save(); ctx.translate(p.x, p.y);
                let pColor = '#fff';
                if(p.itemType==='red') pColor='#ff0055';
                else if(p.itemType==='blue') pColor='#00f0ff';
                else if(p.itemType==='shield') pColor='#00ff55';
                else if(p.itemType==='heal') pColor='#ffaa00';
                else if(p.itemType==='1up') pColor='#ffbd03';

                ctx.fillStyle = pColor; ctx.shadowBlur = 15; ctx.shadowColor = pColor;
                ctx.beginPath(); ctx.arc(0, 0, p.w/2, 0, Math.PI*2); ctx.fill();
                
                ctx.fillStyle = '#000'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                let txt = p.itemType==='red'?'W':(p.itemType==='blue'?'L':(p.itemType==='shield'?'S':(p.itemType==='heal'?'H':'1P')));
                ctx.fillText(txt, 0, 1); ctx.restore();
            });

            // 畫爆炸火花
            particles.forEach(p => {
                ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); ctx.restore();
            });

            drawPlayerJet(player.x, player.y, player.w, player.h);
        }

        function initGame() {
            score = 0; player.hp = 100; player.lives = 3; player.shield = 0;
            player.weaponType = 'normal'; player.weaponLevel = 1;
            enemies = []; playerBullets = []; enemyBullets = []; particles = []; powerups = [];
            player.x = canvas.width / 2; player.y = canvas.height - 120; gameActive = true;
            updateUI();
        }

        function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
        gameLoop();

        window.addEventListener('resize', () => { canvas.width = container.clientWidth; canvas.height = container.clientHeight; });
    </script>
</body>
</html>
